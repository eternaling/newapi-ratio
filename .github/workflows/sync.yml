name: Sync & Convert Ratio
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch upstream json
        run: |
          set -euo pipefail
          URL="https://basellm.github.io/llm-metadata/api/newapi/ratio_config-v1-base.json"
          for attempt in 1 2 3 4 5; do
            rm -f src.json
            if curl --fail --location --silent --show-error \
                 --retry 3 --retry-all-errors --retry-delay 5 \
                 --connect-timeout 15 --max-time 120 \
                 "$URL" -o src.json && [ -s src.json ]; then
              echo "[OK] attempt $attempt: downloaded $(stat -c%s src.json) bytes"
              break
            fi
            echo "::warning::attempt $attempt: download failed or empty body"
            if [ "$attempt" -eq 5 ]; then
              echo "::error::could not download a non-empty src.json after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          ls -lh src.json

      - name: Validate src.json
        run: |
          set -euo pipefail
          test -s src.json || { echo "::error::src.json is empty"; exit 1; }
          python3 -c '
          import json, sys
          root = json.load(open("src.json", encoding="utf-8"))
          expr = (root.get("data") or {}).get("billing_expr")
          if not isinstance(expr, dict) or not expr:
              print("::error::src.json invalid: data.billing_expr missing or empty")
              sys.exit(1)
          print(f"[VALID] {len(expr)} models in data.billing_expr")
          '

      - name: Run convert script
        run: |
          python3 -u convert.py
          cat ratio_config-newapi.json | grep cc12h || echo "no cc12h found in output"

      # 同一份产物发布成三个路径：newapi 的定价同步（选 pricing 接口）
      # 请求 {源地址}/api/pricing，/pricing 是手填/其他工具用的别名
      - name: Publish pricing endpoints
        run: |
          set -euo pipefail
          mkdir -p api
          cp ratio_config-newapi.json api/pricing
          cp ratio_config-newapi.json pricing
          # 三个文件必须完全一致
          cmp ratio_config-newapi.json api/pricing
          cmp ratio_config-newapi.json pricing
          ls -l ratio_config-newapi.json api/pricing pricing

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ratio_config-newapi.json api/pricing pricing
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto update ratio from upstream"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 上传必须在 build 作业里完成；deploy 放到单独的作业，
      # 避免 upload→deploy 同作业时 deploy-pages 查不到刚上传的 artifact
      # （actions/deploy-pages#451 的已知间歇性竞态）
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
