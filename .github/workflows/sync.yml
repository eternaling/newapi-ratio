name: Sync & Convert Ratio
on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动同步一次，可改
  workflow_dispatch: # 支持手动点按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch & convert json
        run: |
          curl -L "https://basellm.github.io/llm-metadata/api/newapi/ratio_config-v1-base.json" -o src.json
          python3 convert.py

      - name: Commit output file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ratio_config-newapi.json
          git commit -m "auto update ratio from upstream" || echo "no change"
          git push
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
